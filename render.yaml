services:
  - type: web
    name: crm-urbyn-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PWD
        sync: false
      - key: APP_ENV
        value: production
